(function(){
  var ADMIN_EMAIL="shoplikevintage@gmail.com";
  var isAdmin=false;
  function syncAdminSidebar(){
    var existing=document.querySelectorAll("[data-shoplike-admin-link]");
    if(!isAdmin){existing.forEach(function(n){n.remove();});return;}
    var drawers=Array.from(document.querySelectorAll("div")).filter(function(el){
      var c=typeof el.className==="string"?el.className:"";
      return c.indexOf("md:hidden")!==-1&&c.indexOf("fixed")!==-1&&c.indexOf("inset-0")!==-1;
    });
    drawers.forEach(function(drawer){
      var track=drawer.querySelector('a[href="/track-order"]');
      if(!track||drawer.querySelector("[data-shoplike-admin-link]"))return;
      var link=document.createElement("a");
      link.href="/admin/dashboard";
      link.textContent="Admin Dashboard";
      link.setAttribute("data-shoplike-admin-link","1");
      link.style.cssText="display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;padding:14px 0;border-bottom:1px solid rgba(139,45,98,.18);color:#8b2d62;font-size:18px;font-weight:600;text-decoration:none;";
      track.insertAdjacentElement("afterend",link);
    });
  }
  function init(){
    if(!window.firebase||!firebase.apps||!firebase.apps.length)return;
    firebase.auth().onAuthStateChanged(function(user){
      isAdmin=!!user&&String(user.email||"").trim().toLowerCase()===ADMIN_EMAIL;
      syncAdminSidebar();
    });
    new MutationObserver(syncAdminSidebar).observe(document.getElementById("root")||document.body,{childList:true,subtree:true});
  }
  var attempts=0,wait=setInterval(function(){
    attempts++;
    if(window.firebase&&firebase.apps&&firebase.apps.length){clearInterval(wait);init();}
    if(attempts>40)clearInterval(wait);
  },250);
})();
